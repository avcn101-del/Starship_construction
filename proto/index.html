<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Duct Tape Navy feel prototype</title>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<!-- Throwaway feel prototype (DESIGN.md 13h, #217, #224). Never a Mission 0 result. -->
<div id="rotate">Turn the phone sideways: the battle is landscape.</div>
<div id="app">
  <header id="bar">
    <div class="group" id="presets" role="group" aria-label="Preset"></div>
    <div class="group" id="speeds" role="group" aria-label="Time"></div>
    <div class="group">
      <button id="pause" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
    </div>
    <div id="clock">0:00</div>
  </header>
  <main id="main">
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hint">Tap an enemy room to target it.</div>
      <div id="end" hidden></div>
    </div>
    <aside id="side">
      <div id="log" aria-live="off"></div>
      <details id="standins" open>
        <summary>STAND-INS</summary>
        <ul id="standin-list"></ul>
      </details>
    </aside>
  </main>
</div>
<script type="module" src="proto.js"></script>
</body>
</html>
